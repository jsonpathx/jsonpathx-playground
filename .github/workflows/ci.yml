name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ci:
    # The single required check: green only when every job above is.
    name: CI
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: ${{ needs.check.result != 'success' }}
        run: exit 1
      - run: echo "All checks passed."
